<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2255"/>
      <stop offset="50%" stop-color="#142c6e"/>
      <stop offset="100%" stop-color="#0a183d"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e05c1a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Cover Background -->
  <rect width="300" height="450" fill="url(#bg)"/>

  <!-- Subtle Editorial Frame -->
  <rect x="20" y="20" width="260" height="410" rx="2" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <rect x="26" y="26" width="248" height="398" rx="2" stroke="#e05c1a" stroke-opacity="0.3" stroke-width="0.75" fill="none"/>

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="18" height="450" fill="url(#spine)"/>
  <line x1="18" y1="0" x2="18" y2="450" stroke="#000000" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Top Monogram / Header -->
  <text x="150" y="60" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="700" letter-spacing="4" fill="#e05c1a">BOOKSPACE</text>
  <text x="150" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#ffffff" fill-opacity="0.5">EDISI RESMI</text>

  <!-- Center Decorative Icon -->
  <circle cx="150" cy="180" r="42" fill="#ffffff" fill-opacity="0.05" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M135 170c0-4 6-6 15-6s15 2 15 6v22c-5-2-10-3-15-3s-10 1-15 3V170z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 164v21" stroke="#e05c1a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="150" cy="180" r="2" fill="#e05c1a"/>

  <!-- Typography Title -->
  <text x="150" y="260" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.5">Koleksi Pilihan</text>
  <line x1="110" y1="278" x2="190" y2="278" stroke="#e05c1a" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" fill="#ffffff" fill-opacity="0.75" letter-spacing="1">LITERATUR TERBAIK</text>

  <!-- Bottom Quality Seal -->
  <rect x="70" y="380" width="160" height="24" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.75"/>
  <text x="150" y="396" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" fill-opacity="0.85" letter-spacing="1.5">100% ORIGINAL &amp; BARU</text>
</svg>
